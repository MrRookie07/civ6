<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Civ 6 Şeref Listesi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🏛️ Civ 6 Şeref Listesi</h1>
  <nav>
    <a href="index.html" class="active">Şeref Listesi</a>
    <a href="rules.html">Kurallar</a>
    <a href="blog.html">Blog</a>
    <a href="playlist.html">Çalma Listesi</a>
    <a href="admin.html">Yönetim</a>
  </nav>
</header>

<div class="hero-banner">
  <div class="crest">👑</div>
  <h1>Şeref Tapınağı</h1>
  <p>Zafer, diplomasiye güvenmeyip mancınığa güvenenlerin olsun.</p>
</div>

<main>
  <section class="panel">
    <h2>🏆 Sıralama</h2>
    <p class="muted">Kayıtlı tüm oyunlardaki toplam puanlar.</p>
    <table id="leaderboard-table">
      <thead>
        <tr><th>#</th><th>Oyuncu</th><th>Puan</th><th>Oyun</th></tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="4" class="muted">Yükleniyor...</td></tr>
      </tbody>
    </table>
  </section>

  <section class="panel">
    <h2>📜 Oyun Tarihçesi</h2>
    <div id="history-list" class="muted">Yükleniyor...</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const MEDALS = ['👑', '🥈', '🥉'];

async function loadData() {
  const { data: games, error: gErr } = await supabaseClient
    .from('games')
    .select('id, played_on, name, description, highlights, note, results(player_name, rank, points), game_images(image_url)')
    .eq('status', 'completed')
    .order('created_at', { ascending: false });

  const leaderboardBody = document.getElementById('leaderboard-body');
  const historyList = document.getElementById('history-list');

  if (gErr) {
    leaderboardBody.innerHTML = `<tr><td colspan="4" class="error">Veriler yüklenemedi. config.js dosyasının doğru ayarlandığından emin olun.</td></tr>`;
    historyList.innerHTML = `<p class="error">Veriler yüklenemedi.</p>`;
    console.error(gErr);
    return;
  }

  if (!games || games.length === 0) {
    leaderboardBody.innerHTML = `<tr><td colspan="4" class="muted">Henüz kayıtlı oyun yok.</td></tr>`;
    historyList.innerHTML = `<p class="muted">Henüz kayıtlı oyun yok.</p>`;
    return;
  }

  // Toplamları hesapla
  const totals = {};
  games.forEach(g => {
    (g.results || []).forEach(r => {
      if (!totals[r.player_name]) totals[r.player_name] = { points: 0, games: 0 };
      totals[r.player_name].points += r.points;
      totals[r.player_name].games += 1;
    });
  });

  const sorted = Object.entries(totals).sort((a, b) => b[1].points - a[1].points);

  leaderboardBody.innerHTML = sorted.map(([name, stats], i) => `
    <tr class="${i < 3 ? 'rank-' + (i + 1) : ''}">
      <td>${i + 1}</td>
      <td>${i < 3 ? `<span class="medal">${MEDALS[i]}</span>` : ''}${escapeHtml(name)}</td>
      <td>${stats.points}</td>
      <td>${stats.games}</td>
    </tr>
  `).join('');

  // Oyun tarihçesi
  historyList.innerHTML = games.map(g => {
    const sortedResults = (g.results || []).slice().sort((a, b) => a.rank - b.rank);
    const title = g.name || g.note || `${g.played_on} tarihli oyun`;
    return `
      <div class="game-card">
        <div class="date">${g.played_on}</div>
        <h3 style="margin:0.2rem 0 0.5rem;">${escapeHtml(title)}</h3>
        ${g.description ? `<p class="muted">${escapeHtml(g.description)}</p>` : ''}
        <ol>
          ${sortedResults.map(r => `<li>${escapeHtml(r.player_name)} — ${r.points} puan</li>`).join('')}
        </ol>
        ${g.highlights ? `<p class="post-body">${escapeHtml(g.highlights)}</p>` : ''}
        ${(g.game_images || []).map(img => `<img class="post-image" src="${img.image_url}" alt="">`).join('')}
      </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadData();
</script>
</body>
</html>
