<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yönetim — Civ 6 Şeref Listesi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🏛️ Civ 6 Şeref Listesi</h1>
  <nav>
    <a href="index.html">Şeref Listesi</a>
    <a href="rules.html">Kurallar</a>
    <a href="blog.html">Günce</a>
    <a href="playlist.html">Çalma Listesi</a>
    <a href="admin.html" class="active">Yönetim</a>
  </nav>
</header>

<div class="hero-banner">
  <div class="crest">⚔️</div>
  <h1>Divan Odası</h1>
  <p>Savaşın sonucunu yalnızca yönetici kayda geçirebilir.</p>
</div>

<main>
  <section class="panel" id="login-panel">
    <h2>🔑 Yönetici Girişi</h2>
    <label for="password">Şifre</label>
    <input type="password" id="password" placeholder="Yönetici şifresini gir">
    <button id="login-btn">Giriş yap</button>
    <div id="login-error" class="error"></div>
  </section>

  <section class="panel" id="new-game-panel" style="display:none;">
    <h2>🚩 Yeni Bir Oyun Başlat</h2>
    <button class="secondary" id="logout-btn" style="margin-top:0;">Çıkış yap</button>

    <label for="game-date">Tarih</label>
    <input type="date" id="game-date">

    <label for="game-name">Oyun Adı</label>
    <input type="text" id="game-name" placeholder="örn. 2026 Büyük Savaşı">

    <label for="game-description">Açıklama (isteğe bağlı)</label>
    <textarea id="game-description" placeholder="Harita türü, hız, kural seti — oyun başlamadan önce belirtilmesi gereken her şey..."></textarea>

    <button id="start-game-btn">Oyunu Başlat</button>
    <div id="start-game-msg"></div>
  </section>

  <section class="panel" id="in-progress-panel" style="display:none;">
    <h2>⏳ Devam Eden Oyunlar</h2>
    <div id="in-progress-list" class="muted">Yükleniyor...</div>
  </section>

  <section class="panel" id="manage-panel" style="display:none;">
    <h2>📜 Kayıtlı Oyunlar</h2>
    <div id="manage-list" class="muted">Yükleniyor...</div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const RANK_LABELS = ['1.', '2.', '3.', '4.', '5.', '6.'];
const RANK_POINTS = [6, 4, 3, 2, 1, 0];

const loginPanel = document.getElementById('login-panel');
const newGamePanel = document.getElementById('new-game-panel');
const inProgressPanel = document.getElementById('in-progress-panel');
const managePanel = document.getElementById('manage-panel');

document.getElementById('game-date').value = new Date().toISOString().slice(0, 10);

async function checkSession() {
  const { data } = await supabaseClient.auth.getSession();
  if (data.session) {
    showAdminPanels();
  }
}

function showAdminPanels() {
  loginPanel.style.display = 'none';
  newGamePanel.style.display = 'block';
  inProgressPanel.style.display = 'block';
  managePanel.style.display = 'block';
  loadInProgressList();
  loadManageList();
}

document.getElementById('login-btn').addEventListener('click', async () => {
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  const { error } = await supabaseClient.auth.signInWithPassword({
    email: ADMIN_EMAIL,
    password
  });
  if (error) {
    errEl.textContent = 'Şifre hatalı.';
    return;
  }
  showAdminPanels();
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await supabaseClient.auth.signOut();
  location.reload();
});

document.getElementById('start-game-btn').addEventListener('click', async () => {
  const msgEl = document.getElementById('start-game-msg');
  msgEl.textContent = '';
  msgEl.className = '';

  const playedOn = document.getElementById('game-date').value;
  const name = document.getElementById('game-name').value.trim();
  const description = document.getElementById('game-description').value.trim();

  if (!name) {
    msgEl.textContent = 'Oyuna bir isim ver.';
    msgEl.className = 'error';
    return;
  }

  const { error } = await supabaseClient.from('games').insert({
    played_on: playedOn,
    name,
    description: description || null,
    status: 'in_progress'
  });

  if (error) {
    msgEl.textContent = 'Oyun başlatılamadı: ' + error.message;
    msgEl.className = 'error';
    return;
  }

  msgEl.textContent = 'Oyun başladı! Bittiğinde sonuçları aşağıya ekle.';
  msgEl.className = 'success';
  document.getElementById('game-name').value = '';
  document.getElementById('game-description').value = '';
  loadInProgressList();
});

async function loadInProgressList() {
  const listEl = document.getElementById('in-progress-list');
  const { data: games, error } = await supabaseClient
    .from('games')
    .select('id, played_on, name, description')
    .eq('status', 'in_progress')
    .order('created_at', { ascending: false });

  if (error) {
    listEl.innerHTML = `<p class="error">Devam eden oyunlar yüklenemedi.</p>`;
    return;
  }

  if (!games || games.length === 0) {
    listEl.innerHTML = `<p class="muted">Devam eden oyun yok. Yukarıdan bir tane başlat.</p>`;
    return;
  }

  listEl.innerHTML = games.map(g => `
    <div class="game-card">
      <div class="date">${g.played_on} · <span class="pill">Devam Ediyor</span></div>
      <h3 style="margin:0.3rem 0;">${escapeHtml(g.name)}</h3>
      ${g.description ? `<p class="muted">${escapeHtml(g.description)}</p>` : ''}
      <button class="finish-game-btn" data-id="${g.id}">Oyunu Bitir</button>
      <div class="finish-form" id="finish-form-${g.id}" style="display:none; margin-top:1rem;"></div>
    </div>
  `).join('');

  document.querySelectorAll('.finish-game-btn').forEach(btn => {
    btn.addEventListener('click', () => openFinishForm(btn.dataset.id));
  });
}

function openFinishForm(gameId) {
  const formEl = document.getElementById(`finish-form-${gameId}`);
  if (formEl.style.display === 'block') {
    formEl.style.display = 'none';
    return;
  }

  formEl.style.display = 'block';
  formEl.innerHTML = `
    ${RANK_LABELS.map((label, i) => `
      <label>${label} sıra (${RANK_POINTS[i]} puan)</label>
      <input type="text" class="finish-rank" data-rank="${i}" placeholder="${i < 5 ? 'Oyuncu adı' : 'Oyuncu adı (isteğe bağlı)'}">
    `).join('')}
    <label>Öne Çıkanlar &amp; Detaylı Tarihçe</label>
    <textarea class="finish-highlights" placeholder="Ne oldu? Önemli anlar, ihanetler, geri dönüşler, nihai skorlar..."></textarea>
    <label>Fotoğraflar (isteğe bağlı, birden fazla eklenebilir)</label>
    <input type="file" class="finish-photos" accept="image/*" multiple>
    <button class="finish-submit-btn" data-id="${gameId}">Kaydet &amp; Oyunu Tamamla</button>
    <div class="finish-msg"></div>
  `;

  formEl.querySelector('.finish-submit-btn').addEventListener('click', () => submitFinishForm(gameId, formEl));
}

async function submitFinishForm(gameId, formEl) {
  const msgEl = formEl.querySelector('.finish-msg');
  msgEl.textContent = '';
  msgEl.className = '';

  const entries = [];
  formEl.querySelectorAll('.finish-rank').forEach(input => {
    const name = input.value.trim();
    const rank = parseInt(input.dataset.rank, 10);
    if (name) entries.push({ player_name: name, rank: rank + 1, points: RANK_POINTS[rank], game_id: gameId });
  });

  if (entries.length < 2) {
    msgEl.textContent = 'En az 2 oyuncu gir.';
    msgEl.className = 'error';
    return;
  }

  const highlights = formEl.querySelector('.finish-highlights').value.trim();
  const files = formEl.querySelector('.finish-photos').files;

  const { error: rErr } = await supabaseClient.from('results').insert(entries);
  if (rErr) {
    msgEl.textContent = 'Sonuçlar kaydedilemedi: ' + rErr.message;
    msgEl.className = 'error';
    return;
  }

  for (const file of files) {
    const path = `${gameId}/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9_.-]/g, '_')}`;
    const { error: upErr } = await supabaseClient.storage.from('game-images').upload(path, file);
    if (upErr) {
      msgEl.textContent = 'Fotoğraf yüklenemedi: ' + upErr.message;
      msgEl.className = 'error';
      return;
    }
    const { data: publicUrlData } = supabaseClient.storage.from('game-images').getPublicUrl(path);
    await supabaseClient.from('game_images').insert({ game_id: gameId, image_url: publicUrlData.publicUrl });
  }

  const { error: gErr } = await supabaseClient
    .from('games')
    .update({ status: 'completed', highlights: highlights || null })
    .eq('id', gameId);

  if (gErr) {
    msgEl.textContent = 'Oyun tamamlanamadı: ' + gErr.message;
    msgEl.className = 'error';
    return;
  }

  msgEl.textContent = 'Oyun tamamlandı!';
  msgEl.className = 'success';
  loadInProgressList();
  loadManageList();
}

async function loadManageList() {
  const listEl = document.getElementById('manage-list');
  const { data: games, error } = await supabaseClient
    .from('games')
    .select('id, played_on, name, description, highlights, note, results(player_name, rank, points), game_images(image_url)')
    .eq('status', 'completed')
    .order('created_at', { ascending: false });

  if (error) {
    listEl.innerHTML = `<p class="error">Oyunlar yüklenemedi.</p>`;
    return;
  }

  if (!games || games.length === 0) {
    listEl.innerHTML = `<p class="muted">Henüz tamamlanmış oyun yok.</p>`;
    return;
  }

  listEl.innerHTML = games.map(g => {
    const sorted = (g.results || []).slice().sort((a, b) => a.rank - b.rank);
    const title = g.name || g.note || `${g.played_on} tarihli oyun`;
    return `
      <div class="game-card">
        <div class="date">${g.played_on}
          <button data-id="${g.id}" class="delete-game" style="background:transparent;border:1px solid #7a3030;color:#e07a7a;padding:0.2rem 0.6rem;margin-top:0;font-size:0.8rem;float:right;">Sil</button>
        </div>
        <h3 style="margin:0.3rem 0;">${escapeHtml(title)}</h3>
        ${g.description ? `<p class="muted">${escapeHtml(g.description)}</p>` : ''}
        <ol>
          ${sorted.map(r => `<li>${escapeHtml(r.player_name)} — ${r.points} puan</li>`).join('')}
        </ol>
        ${g.highlights ? `<p>${escapeHtml(g.highlights)}</p>` : ''}
        ${(g.game_images || []).map(img => `<img class="post-image" src="${img.image_url}" alt="">`).join('')}
      </div>
    `;
  }).join('');

  document.querySelectorAll('.delete-game').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Bu oyun silinsin mi?')) return;
      await supabaseClient.from('games').delete().eq('id', btn.dataset.id);
      loadManageList();
    });
  });
}

function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

checkSession();
</script>
</body>
</html>
